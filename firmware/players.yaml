# CD-i player and firmware database
#
# Purpose: map player makes/models/regions to firmware images so E-Di can
# offer model selection and title-compatibility hints.
#
# Region note: most CD-i titles are region-free, but some titles require a
# player of the matching region (e.g. NTSC-timed titles on an NTSC player).
# The emulator's PAL/NTSC switch covers timing; model/region selection here
# covers firmware behavior differences.
#
# Provenance levels:
#   verified   — file is tracked in firmware/ and its SHA-256 was computed
#                locally from the imported dump.
#   reported   — from an external research dataset (AI-assembled); not
#                verified against a local dump. Treat as lead, not fact.
#   uncertain  — the dataset itself marks the dump/claim as unconfirmed.

