[workspace]
resolver = "2"
members = [
    "crates/cdi-scc68070",
    "crates/cdi-core",
    "crates/cdi-disc",
    "crates/cdi-os9",
    "crates/cdi-frontend",
    "crates/cdi-cli",
    "crates/cdi-photocd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
png = "0.17"
crossbeam-channel = "0.5"
rtrb = "0.3"
eframe = "0.31"
egui = "0.31"
cpal = "0.15"
muda = "0.19"
gilrs = { version = "0.11", features = ["serde-serialize"] }
rfd = "0.15"
env_logger = "0.11"
serde_json = "1"
oxideav-mp2 = "=0.0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
debug = 1
